name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install '.[test]'
      - name: Create the temporary test-ci-key
        run: |
          ssh-keygen -q -t ed25519 -N '' -C "test-ci-key, deleted after this job" \
            -f "$RUNNER_TEMP/test-ci-key"
          eval "$(ssh-agent -s)"
          ssh-add -q "$RUNNER_TEMP/test-ci-key"
          printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" \
            >> "$GITHUB_ENV"
      - name: Set up this checkout
        run: |
          FIRST_COMMIT_AUTHOR_NAME="CI" FIRST_COMMIT_AUTHOR_EMAIL="ci@example.com" \
            FIRST_COMMIT_SIGNING_KEY="$RUNNER_TEMP/test-ci-key.pub" first-commit setup --yes
      - name: Run complete checks
        run: scripts/check full
      - name: Run end-to-end journeys
        run: FIRST_COMMIT_VERIFY_PYTHON="$(command -v python)" scripts/verify fast
      - name: Delete the temporary test-ci-key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/test-ci-key" "$RUNNER_TEMP/test-ci-key.pub"
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then ssh-agent -k > /dev/null || true; fi
